# Configuración del panel /admin (Sveltia CMS)
# Cada cambio que se guarda aquí crea un commit en GitHub.
# Vercel arma la web (scripts/build.mjs) y la publica en ~30 segundos.

backend:
  name: github
  repo: %%GITHUB_REPO%%
  branch: main
  commit_messages:
    create: "Web: crea {{collection}} «{{slug}}»"
    update: "Web: actualiza {{collection}} «{{slug}}»"
    delete: "Web: elimina {{collection}} «{{slug}}»"
    uploadMedia: "Web: sube foto {{path}}"
    deleteMedia: "Web: elimina foto {{path}}"

site_url: %%SITE_URL%%
display_url: %%SITE_URL%%
logo_url: ../img/logo.png

media_folder: img/subidas
public_folder: /img/subidas

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

# Las fotos del celular se achican y convierten a WebP al subirlas
media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 1200
          height: 1200

collections:
  # ---------- SERVICIOS ----------
  - name: servicios
    label: Servicios
    label_singular: servicio
    description: "Las tarjetas de «Todo lo que necesita tu regalón». Se muestran hasta 10."
    icon: medical_services
    folder: data/servicios
    format: json
    create: true
    delete: true
    identifier_field: nombre
    slug: "{{nombre}}"
    summary: "{{nombre}}"
    sortable_fields:
      fields: [orden, nombre]
      default: { field: orden, direction: ascending }
    fields:
      - { name: nombre, label: Servicio, hint: "Ej: Vacunas para perros", widget: string }
      - { name: texto, label: Descripción, hint: "Una o dos frases. Ej: Séxtuple u óctuple y antirrábica.", widget: text }
      - name: categoria
        label: Categoría
        hint: "Sirve para los filtros de la sección."
        widget: select
        options:
          - { label: Vacunas y control, value: vacunas }
          - { label: Cirugías, value: cirugias }
          - { label: Diagnóstico, value: diagnostico }
          - { label: Consultas y urgencias, value: atencion }
        default: atencion
      - name: icono
        label: Ícono
        widget: select
        options:
          - { label: Jeringa, value: jeringa }
          - { label: Gato, value: gato }
          - { label: Perro, value: perro }
          - { label: Microchip, value: chip }
          - { label: Corazón, value: corazon }
          - { label: Tijeras, value: tijera }
          - { label: Bisturí, value: bisturi }
          - { label: Ecografía, value: ecografia }
          - { label: Tubo de ensayo, value: probeta }
          - { label: Estetoscopio, value: estetoscopio }
          - { label: Cruz de urgencia, value: cruz }
          - { label: Huella, value: huella }
        default: huella
      - name: precio
        label: Precio (opcional)
        hint: "Solo números, sin punto. Ej: 13000. Si lo dejas vacío dice «Cotizar por WhatsApp»."
        widget: number
        value_type: int
        required: false
      - { name: precio_nota, label: Nota del precio (opcional), hint: "Ej: por vacuna · Jueves Perrunos", widget: string, required: false }
      - { name: destacado, label: ¿Tarjeta grande?, widget: boolean, default: false, required: false }
      - { name: orden, label: Orden, hint: "Número más bajo = aparece antes.", widget: number, value_type: int, default: 10, required: false }
      - { name: visible, label: ¿Mostrar en la web?, widget: boolean, default: true, required: false }

  # ---------- DATOS GENERALES ----------
  - name: ajustes
    label: Datos de la clínica
    icon: settings
    files:
      - name: ajustes
        label: Contacto, horario y portada
        file: data/ajustes.json
        fields:
          - name: whatsapp
            label: WhatsApp para agendar
            hint: "Formato internacional, solo números. Ej: 56966332397"
            widget: string
            pattern: ["^569\\d{8}$", "Debe partir con 569 y tener 11 números, ej: 56966332397"]
          - { name: mensaje_whatsapp, label: Mensaje inicial de WhatsApp, hint: "Ej: Hola Life Center 👋 Quiero agendar una hora para mi regalón.", widget: string }
          - { name: instagram, label: Usuario de Instagram, hint: "Sin @. Ej: lifecenter_rancagua", widget: string }
          - name: email
            label: Correo
            widget: string
            required: false
            pattern: ["^$|^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$", "Escribe un correo válido, ej: contacto@gmail.com"]
          - { name: ciudad, label: Ciudad, widget: string }
          - { name: region, label: Región, widget: string, required: false }
          - { name: direccion, label: Dirección, hint: "Ej: Alcázar 411, esquina Germán Riesco, Rancagua. Si la dejas vacía, el mapa desaparece.", widget: string, required: false }
          - { name: referencia, label: Referencia, hint: "Ej: A una cuadra de la Plaza Los Héroes", widget: string, required: false }
          - { name: zonas, label: Comunas desde donde llegan, hint: "Aparecen en el formulario. Ej: Rancagua centro, Machalí", widget: list, required: false }
          - { name: hero_eyebrow, label: "Portada: etiqueta de arriba", hint: "Ej: Clínica veterinaria · Rancagua centro", widget: string }
          - { name: hero_titulo, label: "Portada: título", hint: "Ej: Tu regalón en las mejores patas.", widget: string }
          - { name: hero_bajada, label: "Portada: texto", widget: text }
          - { name: hero_foto, label: "Portada: foto", hint: "Una mascota atendida en la clínica. Mejor cuadrada o vertical.", widget: image, required: false }
          - { name: hero_foto_pie, label: "Portada: texto bajo la foto", hint: "Ej: Chaucha, ya recuperada de su cirugía", widget: string, required: false }
          - name: horario
            label: Horario de atención
            hint: "7 días. Si cierran a mediodía, llena también el segundo tramo."
            widget: list
            min: 7
            max: 7
            fields:
              - { name: dia, label: Día, widget: select, options: [Lunes, Martes, Miércoles, Jueves, Viernes, Sábado, Domingo] }
              - { name: cerrado, label: ¿Cerrado este día?, widget: boolean, default: false, required: false }
              - { name: abre, label: Abre, hint: "Formato HH:MM. Ej: 10:00", widget: string, required: false, pattern: ["^$|^([01]?\\d|2[0-3]):[0-5]\\d$", "Usa horas como 10:00 o 15:30"] }
              - { name: cierra, label: Cierra, hint: "Ej: 13:30", widget: string, required: false, pattern: ["^$|^([01]?\\d|2[0-3]):[0-5]\\d$", "Usa horas como 13:30 o 19:00"] }
              - { name: abre2, label: Abre (segundo tramo), hint: "Ej: 15:00", widget: string, required: false, pattern: ["^$|^([01]?\\d|2[0-3]):[0-5]\\d$", "Usa horas como 15:00"] }
              - { name: cierra2, label: Cierra (segundo tramo), hint: "Ej: 19:00", widget: string, required: false, pattern: ["^$|^([01]?\\d|2[0-3]):[0-5]\\d$", "Usa horas como 19:00"] }
          - name: semana
            label: La semana en Life Center
            hint: "Qué pasa cada día (Martes Gatunos, Jueves Perrunos…). Mantén los 7 días."
            widget: list
            required: false
            fields:
              - { name: dia, label: Día, widget: select, options: [Lunes, Martes, Miércoles, Jueves, Viernes, Sábado, Domingo] }
              - { name: titulo, label: Título, hint: "Ej: Martes Gatunos", widget: string }
              - { name: texto, label: Texto, hint: "Ej: Vacuna triple felina y antirrábica $13.000.", widget: string }
              - name: color
                label: Color
                widget: select
                options:
                  - { label: Azul marino, value: marino }
                  - { label: Naranja, value: naranja }
                  - { label: Verde azulado, value: verde }
                  - { label: Gris claro, value: amarillo }
                  - { label: Blanco, value: crema }
                default: crema
              - { name: mensaje, label: Mensaje de WhatsApp, hint: "Ej: Hola Life Center 👋 Quiero agendar para el Martes Gatunos.", widget: string, required: false }
          - name: cifras
            label: Cifras (máximo 3)
            widget: list
            required: false
            max: 3
            fields:
              - { name: prefijo, label: "Antes del número", widget: string, required: false }
              - { name: numero, label: Número, widget: number, value_type: int }
              - { name: sufijo, label: "Después del número", widget: string, required: false }
              - { name: texto, label: Texto, hint: "Ej: seguidores en Instagram", widget: string }

      - name: flyer
        label: Flyer de promoción (popup)
        file: data/flyer.json
        fields:
          - { name: mostrar, label: ¿Mostrar el flyer?, widget: boolean, default: true }
          - { name: popup, label: ¿Abrir como ventana al entrar? (una vez por visita), widget: boolean, default: true }
          - { name: imagen, label: Imagen del flyer, widget: image }
          - { name: titulo, label: Título, hint: "Ej: ¡Jueves Perrunos!", widget: string }
          - { name: texto, label: Texto, widget: text }
          - { name: mensaje, label: Mensaje de WhatsApp, widget: string }

      - name: cartelera
        label: Cartelera (flyers y casos reales)
        file: data/cartelera.json
        fields:
          - name: items
            label: Flyers
            hint: "Hasta 6. Se ven como afiches pegados en la cartelera."
            widget: list
            max: 6
            fields:
              - { name: imagen, label: Imagen, widget: image }
              - { name: titulo, label: Título, hint: "Ej: Jueves Perrunos", widget: string }
              - { name: texto, label: Texto, widget: string, required: false }
              - { name: mensaje, label: Mensaje de WhatsApp, widget: string, required: false }

      - name: testimonios
        label: Opiniones de clientes
        file: data/testimonios.json
        fields:
          - name: testimonios
            label: Opiniones
            hint: "Copia opiniones reales (WhatsApp, Google, Instagram) con permiso. La sección aparece cuando hay al menos una."
            widget: list
            required: false
            fields:
              - { name: texto, label: Opinión, widget: text }
              - { name: nombre, label: Nombre, hint: "Ej: Natalia M.", widget: string }
              - { name: detalle, label: Mascota, widget: string, required: false, hint: "Ej: Dueña de Odie" }
